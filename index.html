<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFix Tuscania - Riparazione & Vendita Cellulari</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Split Card Design */
        .container {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            max-width: 850px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Chobi Section */
        .img-section {
            flex: 1;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            min-height: 450px;
        }

        /* Info Section */
        .card {
            flex: 1;
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo-icon {
            font-size: 45px;
            color: #ff8c00;
            margin-bottom: 15px;
            background: rgba(255, 140, 0, 0.12);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff6a00 0%, #ffc000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 14px;
            color: #0f172a;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .address-box {
            background: rgba(15, 23, 42, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
            color: #1e293b;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            line-height: 1.4;
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        .address-box i {
            color: #ff8c00;
            font-size: 16px;
        }

        .divider {
            height: 1px;
            background: rgba(15, 23, 42, 0.12);
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-whatsapp { background-color: #25d366; color: #ffffff; }
        .btn-whatsapp:hover { background-color: #20ba5a; transform: translateY(-2px); }

        .btn-gmail { background-color: #ea4335; color: #ffffff; }
        .btn-gmail:hover { background-color: #d33828; transform: translateY(-2px); }

        .btn-maps { background-color: #0f172a; color: #ffffff; }
        .btn-maps:hover { background-color: #1e293b; transform: translateY(-2px); }

        .btn i { font-size: 18px; }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }

        /* Responsive Design for Mobile */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .img-section { min-height: 250px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bam pashe Apnar Chobi -->
        <div class="img-section"></div>

        <!-- Dan pashe Details -->
        <div class="card">
            <div class="logo-icon">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
            
            <h1>IFIX TUSCANIA</h1>
            <p class="tagline">Riparazione & Vendita Cellulari</p>

            <div class="address-box">
                <i class="fa-solid fa-location-dot"></i>
                <span>VIA TARQUINIA N.101<br>TUSCANIA (VT) CAP 01017</span>
            </div>
            
            <div class="divider"></div>

            <div class="btn-container">
                <a href="https://wa.me/393509239809" target="_blank" class="btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </a>

                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=mdaminakon.bd@gmail.com" target="_blank" class="btn btn-gmail">
                    <i class="fa-solid fa-envelope"></i> Email (Gmail)
                </a>

                <a href="https://www.google.com/maps/search/?api=1&query=VIA+TARQUINIA+N.101+TUSCANIA+VT+01017" target="_blank" class="btn btn-maps">
                    <i class="fa-solid fa-map-location-dot"></i> Google Maps
                </a>
            </div>

            <footer>
                &copy; 2026 iFix Tuscania. Tutti i diritti riservati.
            </footer>
        </div>
    </div>

</body>
</html>
